<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Intelligence Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary px-4">
      <span class="navbar-brand">Invoice Intelligence Portal</span>
      <span class="text-white small">Full-stack reimplementation of the Streamlit workflow</span>
    </nav>
    <div class="container-fluid mt-3">
      <div class="row g-3">
        <div class="col-lg-3">
          <section class="card h-100 shadow-sm">
            <div class="card-header d-flex align-items-center justify-content-between">
              <h6 class="mb-0">Upload invoice</h6>
              <div class="spinner-border spinner-border-sm text-secondary d-none" role="status" id="uploadSpinner"></div>
            </div>
            <div class="card-body">
              <form id="uploadForm">
                <div class="mb-3">
                  <label for="invoiceFile" class="form-label">Select PDF</label>
                  <input class="form-control" type="file" id="invoiceFile" accept="application/pdf" required />
                </div>
                <button class="btn btn-primary w-100" type="submit">Process invoice</button>
              </form>
              <hr />
              <h6>Invoices</h6>
              <div class="list-group invoice-list" id="invoiceList"></div>
            </div>
          </section>
        </div>
        <div class="col-lg-6">
          <section class="card shadow-sm mb-3">
            <div class="card-header">
              <h6 class="mb-0">Analytics</h6>
            </div>
            <div class="card-body">
              <div class="row text-center" id="analyticsSummary">
                <div class="col">
                  <div class="metric-card">
                    <span class="metric-label">Invoices</span>
                    <span class="metric-value" id="metricInvoices">0</span>
                  </div>
                </div>
                <div class="col">
                  <div class="metric-card">
                    <span class="metric-label">Total value</span>
                    <span class="metric-value" id="metricTotal">$0</span>
                  </div>
                </div>
                <div class="col">
                  <div class="metric-card">
                    <span class="metric-label">Outstanding</span>
                    <span class="metric-value" id="metricOutstanding">$0</span>
                  </div>
                </div>
              </div>
              <canvas id="vendorChart" height="140"></canvas>
            </div>
          </section>
          <section class="card shadow-sm" id="invoiceDetails" data-hidden="true">
            <div class="card-header d-flex align-items-center justify-content-between">
              <div>
                <h6 class="mb-0" id="detailVendor"></h6>
                <small class="text-muted" id="detailInvoiceMeta"></small>
              </div>
              <span class="badge bg-secondary" id="detailTotal"></span>
            </div>
            <div class="card-body">
              <dl class="row small">
                <dt class="col-sm-4">Customer</dt>
                <dd class="col-sm-8" id="detailCustomer"></dd>
                <dt class="col-sm-4">Payment terms</dt>
                <dd class="col-sm-8" id="detailTerms"></dd>
                <dt class="col-sm-4">Customer ID</dt>
                <dd class="col-sm-8" id="detailCustomerId"></dd>
              </dl>
              <div class="table-responsive">
                <table class="table table-sm" id="lineItemsTable">
                  <thead>
                    <tr>
                      <th scope="col">Description</th>
                      <th scope="col" class="text-end">Qty</th>
                      <th scope="col" class="text-end">Unit price</th>
                      <th scope="col" class="text-end">Amount</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
        <div class="col-lg-3">
          <section class="card h-100 shadow-sm">
            <div class="card-header">
              <h6 class="mb-0">Invoice assistant</h6>
            </div>
            <div class="card-body d-flex flex-column">
              <div class="chat-window" id="chatWindow"></div>
              <form id="chatForm" class="mt-3">
                <div class="input-group">
                  <input type="text" class="form-control" id="chatInput" placeholder="Ask a question" autocomplete="off" />
                  <button class="btn btn-outline-primary" type="submit">Send</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
